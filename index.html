<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#061c1a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Trama: explora una malla curricular y sus relaciones de prerrequisitos."
    />
    <title>Trama — Malla curricular</title>
    <link rel="icon" href="assets/trama/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/trama.css" />
    <script defer src="js/lib/cytoscape.min.js"></script>
    <script defer src="js/lib/dagre/dagre.min.js"></script>
    <script defer src="js/lib/cytoscape-dagre/cytoscape-dagre.js"></script>
    <script type="module" src="js/ui/app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#workspace">Saltar al contenido</a>
    <header class="app-bar">
      <button class="brand" data-action="about" aria-label="Acerca de Trama">
        <img src="assets/trama/mark.svg" width="24" height="24" alt="" />Trama
      </button>
      <nav class="view-nav" aria-label="Vistas principales">
        <button data-view="grid">Malla</button
        ><button data-view="graph">Grafo</button
        ><button data-view="analysis">Análisis</button>
      </nav>
      <label class="search"
        ><img
          src="assets/trama/search.svg"
          width="16"
          height="16"
          alt=""
        /><span class="sr-only">Buscar curso o código</span
        ><input
          id="search"
          placeholder="Buscar curso o código"
          type="search"
          autocomplete="off"
        /><kbd>/</kbd></label
      >
      <button class="seed-chip" data-action="seed">
        <img src="assets/trama/dot.svg" width="6" height="6" alt="" /><span
          id="seed-label"
          >SEMILLA</span
        ><img src="assets/trama/regenerate.svg" width="14" height="14" alt="" />
      </button>
      <button
        class="icon-button mobile-search-toggle"
        data-action="search"
        aria-label="Buscar curso"
      >
        <img src="assets/trama/search.svg" width="16" height="16" alt="" />
      </button>
      <button
        class="icon-button"
        data-action="about"
        aria-label="Acerca de Trama"
      >
        <img src="assets/trama/info.svg" width="18" height="18" alt="" />
      </button>
    </header>
    <main id="workspace" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Vistas móviles">
      <button data-view="grid">
        <img
          src="assets/trama/nav-grid.svg"
          width="20"
          height="20"
          alt=""
        />Malla</button
      ><button data-view="graph">
        <img
          src="assets/trama/nav-graph.svg"
          width="20"
          height="20"
          alt=""
        />Grafo</button
      ><button data-view="analysis">
        <img
          src="assets/trama/nav-analysis.svg"
          width="20"
          height="20"
          alt=""
        />Análisis
      </button>
    </nav>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <noscript
      >Trama necesita JavaScript para generar y explorar la malla
      curricular.</noscript
    >
  </body>
</html>
